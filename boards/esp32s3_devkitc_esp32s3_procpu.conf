# ESP32-S3-DevKitC-1 — the Wi-Fi concentrator variant.
#
# Applied automatically for this board target. If a build ever ignores it, pass
# it explicitly with -DEXTRA_CONF_FILE=boards/esp32s3_devkitc_esp32s3_procpu.conf
# rather than moving settings into prj.conf, which is shared by all three
# variants.

# Transport ------------------------------------------------------------------
# Chosen here rather than left to the Kconfig default, because this board has
# no SX127x to talk to and no wired interface. Building it any other way is a
# mistake, not a choice.
CONFIG_APP_LINK_WIFI=y

# One core, deliberately -----------------------------------------------------
# The APPCPU stays off. Zephyr's own documentation says access to Zephyr-managed
# serial drivers — printk(), logging, the console UART — is not implemented for
# applications running on the APPCPU, and a concentrator that cannot log on a
# core is worse than one that does not use it. CONFIG_WIFI_ESP32 depends on
# !SMP in any case, so this is not optional while Wi-Fi is on.

# Networking -----------------------------------------------------------------
# One outbound TCP connection and nothing else: no server, no second socket.
# These are starting points sized for that, not measurements. Raise them if the
# logs show packet or buffer exhaustion, and shrink them once the real traffic
# is known.
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# The association result arrives on the net_mgmt event thread, and hal::link's
# handler runs there. It does almost nothing, but the Wi-Fi and DHCP events it
# shares the thread with do not.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# prj.conf sets 2048, which is what the LoRaMac secure element needs. The
# network stack shares this workqueue and wants more room than that.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Heap -----------------------------------------------------------------------
# Not set here on purpose. prj.conf keeps CONFIG_HEAP_MEM_POOL_SIZE=0 on every
# variant, and Zephyr rounds the real heap up to whatever the Espressif Wi-Fi
# driver declares through HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI. Read the comment in
# prj.conf before changing this: putting a number here would replace the SDK's
# own accounting with a guess.
#
# To move the adapter heap into PSRAM on an -N8R8 part and cut the kernel heap
# from 51200 to 19456 bytes, add CONFIG_ESP_WIFI_HEAP_SPIRAM=y. Confirm the
# board's PSRAM is enabled first.
