# Debug overlay, ESP32-S3 only. Applied after prj_debug.conf by
# run_build_tool.py when --debug builds the wifi variant.
#
# Why this exists: with prj_debug.conf alone the board does not boot. The
# bootloader loads the image, prints its map, and the firmware dies before
# Zephyr's banner - during Espressif's Wi-Fi and BT blob initialisation.
#
# The numbers, from the two boot logs:
#
#                    release      debug
#     IRAM            65 316 B    92 436 B
#     libc heap       139 kB      110 kB
#
# -Og costs 27 kB of IRAM against -Os, and on this SoC that comes straight out
# of the heap the blobs allocate from. They ask for 80 kB (51200 Wi-Fi + 25600
# BT) and 110 kB is not enough once everything else has taken its share.
#
# So this build keeps every debug feature except the optimisation level.
# Stepping is worse - the compiler still reorders and inlines - but a firmware
# that boots and can be broken into beats one that steps beautifully and does
# not run.
#
# The nRF52840 has room and keeps -Og. This is an ESP32-S3 problem, not a
# general one.
CONFIG_DEBUG_OPTIMIZATIONS=n
