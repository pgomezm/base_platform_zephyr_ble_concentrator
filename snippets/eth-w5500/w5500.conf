# Ethernet driver and L2 for the W5500. The transport itself (sockets, TCP,
# IPv4) is selected by CONFIG_APP_LINK_TCP in the application's Kconfig, so this
# file carries only what is specific to this piece of hardware.
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_W5500=y

# The W5500 driver runs its own receive thread. The default stack is enough for
# the interrupt-to-netif path, but it is called out here so a stack overflow in
# that thread is looked for in this file rather than blamed on the application.
CONFIG_ETH_W5500_RX_THREAD_STACK_SIZE=1024
