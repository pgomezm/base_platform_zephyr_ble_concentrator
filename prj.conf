# C++ ------------------------------------------------------------------------
# The firmware is C++, following the same active-object structure as
# deepsight-polaris-software. No exceptions and no RTTI: both cost flash and
# neither is used.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBCPP=n

# Memory ---------------------------------------------------------------------
# Nothing is allocated at run time. Every queue, pool and table is static and
# sized by a Kconfig symbol, which is what makes the memory budget auditable.
CONFIG_HEAP_MEM_POOL_SIZE=0

# Bluetooth ------------------------------------------------------------------
# Observer only: the concentrator scans and never advertises, connects, or
# serves GATT.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="ble-lora-concentrator"

# LoRa -----------------------------------------------------------------------
# Zephyr's own LoRaWAN subsystem, which is the Lora-net LoRaMac-node stack
# already ported and pulled in through west.
CONFIG_SPI=y
CONFIG_LORA=y
CONFIG_LORA_SX127X=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_REGION_US915=y
# The LoRaMac stack needs Semtech's software secure element for its crypto.
# Zephyr only implies it when the system workqueue stack is at least 2048 bytes,
# so without this the whole build links fine until it fails on a wall of
# undefined SecureElement* references.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Peripherals ----------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Logging --------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_APP_LOG_LEVEL_INF=y
CONFIG_UART_CONSOLE=y

# Threads --------------------------------------------------------------------
# Named threads make a stack trace or a shell dump readable.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
