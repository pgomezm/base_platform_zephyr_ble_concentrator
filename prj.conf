# C++ ------------------------------------------------------------------------
# The firmware is C++, following the same active-object structure as
# deepsight-polaris-software. No exceptions and no RTTI: both cost flash and
# neither is used.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBCPP=n

# Memory ---------------------------------------------------------------------
# Nothing is allocated at run time. Every queue, pool and table is static and
# sized by a Kconfig symbol, which is what makes the memory budget auditable.
CONFIG_HEAP_MEM_POOL_SIZE=0

# Bluetooth ------------------------------------------------------------------
# Observer only: the concentrator scans and never advertises, connects, or
# serves GATT.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="ble-concentrator"

# Uplink transport -----------------------------------------------------------
# Not configured here. CONFIG_APP_LINK_LORA (the default) and CONFIG_APP_LINK_TCP
# each select the Zephyr subsystem they need, so this file stays the same for
# both variants and the transport is one symbol, not a block of them. See the
# "Uplink transport" menu in Kconfig.
#
# The LoRaMac stack needs Semtech's software secure element for its crypto.
# Zephyr only implies it when the system workqueue stack is at least 2048 bytes,
# so without this a LoRa build links fine until it fails on a wall of undefined
# SecureElement* references. The TCP variant needs a workqueue of about this
# size for the network stack anyway.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Non-volatile settings ------------------------------------------------------
# The LoRaWAN stack stores its MAC context here, which is what makes the DevNonce
# survive a reboot. From LoRaWAN 1.0.4 an OTAA join must present a DevNonce
# higher than the last one the join server saw for that DevEUI; a device that
# restarts at zero has its join rejected as a replay, and the symptom is a join
# that used to work and now silently does not.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_LORAWAN_NVM_SETTINGS=y

# Peripherals ----------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Logging --------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_APP_LOG_LEVEL_INF=y
CONFIG_UART_CONSOLE=y

# Threads --------------------------------------------------------------------
# Named threads make a stack trace or a shell dump readable.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
