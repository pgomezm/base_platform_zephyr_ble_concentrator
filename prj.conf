# Build ----------------------------------------------------------------------
# A warning is a defect nobody has diagnosed yet, so the build refuses to make
# an image with one in it. This covers the whole tree, Zephyr included. The
# extra warning flags the application is held to are in CMakeLists.txt.
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y

# C++ ------------------------------------------------------------------------
# No exceptions and no RTTI: both cost flash and neither is used. Errors travel
# as return codes instead.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBCPP=n

# Memory ---------------------------------------------------------------------
# Nothing this firmware writes allocates at run time. Every queue, pool and
# table is static and sized by a Kconfig symbol, which is what makes the memory
# budget auditable.
#
# This line stays at 0 on every variant, including Wi-Fi, and it is not a
# loophole. Zephyr treats HEAP_MEM_POOL_SIZE as a floor, not a ceiling: a
# subsystem that needs a heap declares it through HEAP_MEM_POOL_ADD_SIZE_*, and
# if the sum of those exceeds this value - even at 0 - the real heap is rounded
# up to the sum. So a LoRa or TCP build genuinely has no heap, because nothing
# declares one, and the Wi-Fi build gets exactly what the vendor's drivers ask
# for and not a byte more.
#
# Measured on the first ESP32-S3 build, from its own .config:
#
#     HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI   51200
#     HEAP_MEM_POOL_ADD_SIZE_ESP_BT     25600
#     HEAP_MEM_POOL_ADD_SIZE_BOARD       4096
#                                       -----
#     K_HEAP_MEM_POOL_SIZE              80896
#
# Note the second line: it is not only Wi-Fi. On this part the Bluetooth
# controller is an Espressif blob that allocates through k_malloc, where on the
# Nordic builds the controller is Zephyr's own and asks for nothing. Enabling
# BLE is what costs the other 25 KB, and it would cost it on this SoC with no
# Wi-Fi at all.
#
# CONFIG_ESP_WIFI_HEAP_SPIRAM=y moves the Wi-Fi adapter's share to PSRAM and
# takes its 51200 down to 19456 - the one measured thing the -N8R8 part's PSRAM
# buys. On the first build the internal DRAM was at 62.67%, so it is worth
# knowing about before that number grows.
CONFIG_HEAP_MEM_POOL_SIZE=0

# Bluetooth ------------------------------------------------------------------
# Observer only: the concentrator scans and never advertises, connects, or
# serves GATT.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="ble-concentrator"

# Uplink transport -----------------------------------------------------------
# Not configured here. CONFIG_APP_LINK_LORA (the default) and CONFIG_APP_LINK_TCP
# each select the Zephyr subsystem they need, so this file stays the same for
# both variants and the transport is one symbol, not a block of them. See the
# "Uplink transport" menu in Kconfig.
#
# The LoRaMac stack needs Semtech's software secure element for its crypto.
# Zephyr only implies it when the system workqueue stack is at least 2048 bytes,
# so without this a LoRa build links fine until it fails on a wall of undefined
# SecureElement* references. The TCP variant needs a workqueue of about this
# size for the network stack anyway.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Non-volatile settings ------------------------------------------------------
# Not configured here either. The flash, NVS and settings stack exists so the
# LoRaWAN DevNonce survives a reboot, so it is selected by CONFIG_APP_LINK_LORA
# and is absent from a build with no LoRa stack to store anything. It used to be
# switched on unconditionally here, which meant the TCP variant carried a flash
# partition and a settings backend it never wrote to.

# Peripherals ----------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Logging --------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_APP_LOG_LEVEL_INF=y
CONFIG_UART_CONSOLE=y

# Threads --------------------------------------------------------------------
# Named threads make a stack trace or a shell dump readable.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

# LoRaWAN ---------------------------------------------------------------------
CONFIG_APP_DISPATCH_PERIOD_S=60
