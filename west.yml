manifest:
  version: "0.13"

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      # Pin deliberately. Bump it as a reviewed change, not by drift: every
      # Kconfig symbol and devicetree property this firmware uses has to be
      # confirmed against whatever revision is pinned here.
      revision: v4.4.1
      # Pulls in Zephyr's own module list, which includes loramac-node, the
      # stack behind CONFIG_LORAWAN.
      import: true

  self:
    path: .
