# Debug overlay. Applied with --debug on run_build_tool.py, never by default.
#
#     python build_flash_tools/run_build_tool.py --variant lora --debug
#
# Builds into build/<variant>-debug, so the release build in build/<variant> is
# left alone and switching between them costs no rebuild.

# Optimisation ----------------------------------------------------------------
# -Os reorders and inlines, which is why stepping through a release build jumps
# backwards and shows <optimized out> for half the locals. -Og keeps the code
# recognisable.
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y

# CONFIG_DEBUG is also what makes CMakeLists define APP_DEBUG_BUILD, which is
# what makes ASSERT_CRITICAL real. In a release build it compiles to nothing and
# utils::fault is the whole handling. See docs/CODING_STANDARD.md, D1.

# Thread awareness ------------------------------------------------------------
# Lets a debugger list the threads by name instead of showing one stack.
CONFIG_DEBUG_THREAD_INFO=y

# Faults ----------------------------------------------------------------------
# Do not reboot out of a crash: stop, and print the registers and the stack.
# Rebooting erases the scene, which is the one thing worth having.
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_ASSERT=y

# Stacks ----------------------------------------------------------------------
# Every active object uses Thread::STACK_SIZE = 2048, a number that was chosen
# by copying and never measured. This prints what each one actually used.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_RUN_UNLOCKED=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30

# Overflowing a stack corrupts whatever is next in RAM, silently. This turns it
# into a fault with a message.
CONFIG_HW_STACK_PROTECTION=y

# Logging ---------------------------------------------------------------------
CONFIG_APP_LOG_LEVEL_DBG=y
