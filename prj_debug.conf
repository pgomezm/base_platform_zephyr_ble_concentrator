# Debug overlay. Applied with --debug on run_build_tool.py, never by default.
#
#     python build_flash_tools/run_build_tool.py --variant lora --debug
#
# Builds into build/<variant>-debug, so the release build in build/<variant> is
# left alone and switching between them costs no rebuild.
#
# Every symbol here has to exist on BOTH boards. Zephyr aborts on a Kconfig
# warning, so one that is only defined for Arm takes the Wi-Fi build down.

# Optimisation ----------------------------------------------------------------
# -Os reorders and inlines, which is why stepping through a release build jumps
# backwards and shows <optimized out> for half the locals. -Og keeps the code
# recognisable.
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y

# CONFIG_DEBUG is also what makes CMakeLists define APP_DEBUG_BUILD, which is
# what makes ASSERT_CRITICAL real. In a release build it compiles to nothing and
# utils::fault is the whole handling. See docs/CODING_STANDARD.md, D1.

# Zephyr's own assertions, off by default.
CONFIG_ASSERT=y

# Thread awareness ------------------------------------------------------------
# Lets a debugger list the threads by name instead of showing one stack.
CONFIG_DEBUG_THREAD_INFO=y

# Stacks ----------------------------------------------------------------------
# Every active object uses Thread::STACK_SIZE = 2048, a number that was chosen
# by copying and never measured. This prints what each one actually used, every
# interval, by name.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_RUN_UNLOCKED=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30

# Logging ---------------------------------------------------------------------
CONFIG_APP_LOG_LEVEL_DBG=y

# What is deliberately not here ------------------------------------------------
#
# CONFIG_HW_STACK_PROTECTION - already y on the nRF52840 by default, and not
#   defined at all on the ESP32-S3, whose Xtensa port has no equivalent. Setting
#   it here would abort the Wi-Fi build for no gain on the other.
#
# CONFIG_EXCEPTION_STACK_TRACE - needs ARCH_HAS_STACKWALK, which neither board
#   selects in this configuration.
#
# CONFIG_RESET_ON_FATAL_ERROR - does not exist. Zephyr's default
#   k_sys_fatal_error_handler() already halts rather than reboots, so there was
#   nothing to turn off. Overriding that handler is the way to change it.
